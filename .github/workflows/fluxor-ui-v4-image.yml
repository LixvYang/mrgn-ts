name: Build fluxor-ui-v4 image and deploy to Coolify

on:
  push:
    branches:
      - fluxor-lend-0.1.6-0.0.1
  workflow_dispatch:

concurrency:
  group: fluxor-ui-v4-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lixvyang/fluxor-ui-v4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fluxor-ui-v4.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MARGINFI_ENVIRONMENT=${{ secrets.NEXT_PUBLIC_MARGINFI_ENVIRONMENT }}
            NEXT_PUBLIC_MARGINFI_RPC_ENDPOINT_OVERRIDE=${{ secrets.NEXT_PUBLIC_MARGINFI_RPC_ENDPOINT_OVERRIDE }}
            NEXT_PUBLIC_MARGINFI_PROGRAM_OVERRIDE=${{ secrets.NEXT_PUBLIC_MARGINFI_PROGRAM_OVERRIDE }}
            NEXT_PUBLIC_MARGINFI_GROUP_OVERRIDE=${{ secrets.NEXT_PUBLIC_MARGINFI_GROUP_OVERRIDE }}
            NEXT_PUBLIC_RPC_PROXY_KEY=${{ secrets.NEXT_PUBLIC_RPC_PROXY_KEY }}
            NEXT_PUBLIC_MIXIN_BOT_ID=${{ secrets.NEXT_PUBLIC_MIXIN_BOT_ID }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify 拉 :latest 并滚动替换容器
      - name: Deploy on Coolify
        run: |
          curl -fsS -X POST "${{ secrets.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ secrets.COOLIFY_APP_UUID }}","force":false}'
